name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Check formatting and lint
        run: |
          ruff check aiobookoo_ultra tests
          ruff format --check aiobookoo_ultra tests
      - name: Run tests
        run: python -m pytest -q
